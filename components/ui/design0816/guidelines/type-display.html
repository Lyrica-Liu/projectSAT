<!-- @dsCard group="Type" viewport="700x260" name="Display & headings" subtitle="Source Serif 4, roman — never italic for display" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
body{margin:0;padding:26px;background:var(--surface);color:var(--text-strong)}
.stack{display:flex;flex-direction:column;gap:18px}
.line{display:flex;align-items:baseline;gap:20px}
.tag{font-family:var(--font-sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);width:104px;flex-shrink:0}
.hero{font-family:var(--font-serif);font-size:52px;font-weight:400;letter-spacing:-.022em;line-height:1.02}
.title{font-family:var(--font-serif);font-size:28px;font-weight:400;letter-spacing:-.02em}
.cardt{font-family:var(--font-serif);font-size:22px;font-weight:600}
.lead{font-family:var(--font-serif);font-size:17px;color:var(--text-muted);line-height:1.6}
</style>
</head>
<body>
<div class="stack">
<div class="line"><span class="tag">52 / 400</span><span class="hero">Thirty days, decided.</span></div>
<div class="line"><span class="tag">28 / 400</span><span class="title">Words in Context</span></div>
<div class="line"><span class="tag">22 / 600</span><span class="cardt">Skill accuracy</span></div>
<div class="line"><span class="tag">17 / lead</span><span class="lead">Twelve questions a sitting, timed like the real thing.</span></div>
</div>
</body>
</html>
