<!-- @dsCard group="Type" viewport="700x230" name="Body, labels & figures" subtitle="Serif for reading; sans only small — labels, chrome, tabular figures" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
body{margin:0;padding:26px;background:var(--surface)}
.stack{display:flex;flex-direction:column;gap:18px}
.line{display:flex;align-items:baseline;gap:20px}
.tag{font-family:var(--font-sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);width:104px;flex-shrink:0}
.body{font-family:var(--font-serif);font-size:17px;color:var(--text-body);line-height:1.68;max-width:430px}
.meta{font-family:var(--font-sans);font-size:13px;color:var(--text-muted)}
.eyebrow{font-family:var(--font-sans);font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint)}
.fig{font-family:var(--font-sans);font-size:15px;font-variant-numeric:tabular-nums;color:var(--text-strong)}
</style>
</head>
<body>
<div class="stack">
<div class="line"><span class="tag">serif 17</span><span class="body">Passages and questions are set in the reading serif, at a measure narrow enough to read without effort.</span></div>
<div class="line"><span class="tag">sans 13</span><span class="meta">12 questions · 18 min · Day 11 of 30</span></div>
<div class="line"><span class="tag">sans caps 11</span><span class="eyebrow">Command of Evidence</span></div>
<div class="line"><span class="tag">tabular</span><span class="fig">14:22 · 83% · 10 / 12</span></div>
</div>
</body>
</html>
